<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <!-- Isotipo CONAF recortado del banner institucional. Ruta ABSOLUTA con la
         barra inicial: Vite le antepone el `base` (/coipo_vista_catastro/) al
         construir, y así vale igual desde la raíz que desde una página anidada. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#064928" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catastro de Usos de la Tierra y Recursos Vegetacionales — CONAF</title>

    <!-- La descripción, el canonical y la vista previa (og:, twitter:) NO se
         escriben aquí: los genera scripts/prerender.mjs del manifest al construir
         y los pone en la marca de abajo. Escritos a mano llevaban una cifra de los
         datos que se quedaba diciendo lo de antes (mejoras M8), y og:description
         tiene que ser TEXTUALMENTE la meta description. En `npm run dev` la marca
         queda como comentario, y es inocuo. -->
    <!--cabeza-->

    <!-- La hoja de lo horneado (la portada que se ve antes de que monte la app y
         las páginas por región y comuna). Nombre estable, en public/. -->
    <link rel="stylesheet" href="/paginas.css" />

    <!-- SIN el atributo crossorigin, y no es un olvido: no lo "arregles".
         Leaflet pide las teselas con <img> y sin crossOrigin, o sea peticiones
         en modo no-CORS. Un preconnect anonimo abre la conexion en OTRO pool de
         sockets, no se reutiliza para esas peticiones y obliga al navegador a
         abrir una segunda: el apreton se pagaria dos veces en vez de cero.
         El host esta acoplado a BASEMAPS.Claro en src/config.js: era
         basemaps.cartocdn.com hasta que CARTO cerro el acceso anonimo en agosto
         de 2026, y ahora precalienta el host de Esri, del que salen CINCO de los
         siete mapas base (Claro, Oscuro, Relieve, Topografico y Satelital). -->
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
  </head>
  <body>
    <!-- Al construir se hornea aquí la portada (scripts/prerender.mjs): el
         banner, qué es el visor, la frase citable con las cifras nacionales y la
         tabla de usos. Es lo que leen los asistentes de IA, que no ejecutan
         JavaScript, y lo que ve una persona mientras baja el visor. main.jsx
         monta la app con createRoot, que lo reemplaza.

         Antes había aquí un cascarón #arranque con position:fixed encima de
         #root. Con texto horneado debajo, eso sería texto que ven los robots y no
         las personas: ocultación. Se quitó; su banda y su «Cargando…» viven ahora
         dentro de la portada. -->
    <div id="root"></div>
    <script>
      // setTimeout clasico y no un observer: el unico objetivo es que, si la
      // descarga se atasca, la pantalla deje de mentir diciendo "cargando".
      // Cambia el texto de la línea de estado horneada; si la app ya montó, la
      // línea no existe y esto no hace nada.
      setTimeout(function () {
        var e = document.getElementById('arranque-lento')
        if (e) e.textContent = 'Está tardando más de lo normal. Las cifras de abajo no dependen de la descarga.'
      }, 15000)
    </script>
    <noscript>
      <p style="font: 15px system-ui; padding: 0 20px">
        El mapa de este visor necesita JavaScript. Las cifras de arriba no, y tampoco
        las de cada región y comuna, que están en
        <a href="./regiones/">Cifras por región y comuna</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
