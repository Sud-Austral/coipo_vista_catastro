<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Isotipo CONAF recortado del banner institucional. Rutas relativas: la
         app se sirve bajo /coipo_vista_catastro/, y una barra inicial pediria
         los iconos a la raiz del dominio. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png" />
    <meta name="theme-color" content="#064928" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visor del Catastro de Usos de la Tierra y Recursos Vegetacionales de CONAF: 1.827.933 polígonos del Catastro de Bosque Nativo por uso de suelo, con superficie y ubicación."
    />
    <title>Catastro de Usos de la Tierra y Recursos Vegetacionales — CONAF</title>

    <!-- Tarjeta al compartir el enlace. La decision de abrir un sitio de 35 MB
         en un telefono con plan de datos se toma mirando esto.
         SIN og:image mientras no exista una PNG de 1200x630: declararlo
         apuntando a un archivo inexistente hace que varios lectores descarten
         la tarjeta ENTERA, que es peor que no tenerla.
         og:description repite TEXTUALMENTE la meta description: dos redacciones
         del mismo texto divergen a la primera edicion. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CONAF · Gerencia de Fiscalización Forestal y Evaluación Ambiental" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://sud-austral.github.io/coipo_vista_catastro/" />
    <meta property="og:title" content="Catastro de Usos de la Tierra y Recursos Vegetacionales — CONAF" />
    <meta
      property="og:description"
      content="Visor del Catastro de Usos de la Tierra y Recursos Vegetacionales de CONAF: 1.827.933 polígonos del Catastro de Bosque Nativo por uso de suelo, con superficie y ubicación."
    />
    <meta name="twitter:card" content="summary" />

    <!-- SIN el atributo crossorigin, y no es un olvido: no lo "arregles".
         Leaflet pide las teselas con <img> y sin crossOrigin, o sea peticiones
         en modo no-CORS. Un preconnect anonimo abre la conexion en OTRO pool de
         sockets, no se reutiliza para esas peticiones y obliga al navegador a
         abrir una segunda: el apreton se pagaria dos veces en vez de cero.
         El host esta acoplado a BASEMAPS.Claro en src/config.js: era
         basemaps.cartocdn.com hasta que CARTO cerro el acceso anonimo en agosto
         de 2026, y ahora precalienta el host de Esri, del que salen CINCO de los
         siete mapas base (Claro, Oscuro, Relieve, Topografico y Satelital). -->
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />

    <link rel="canonical" href="https://sud-austral.github.io/coipo_vista_catastro/" />

    <style>
      /* Cascaron de arranque, en linea y con la banda ya dimensionada: el
         bundle son ~700 kB y el .bin 23,8 MB, asi que sin esto la primera
         pantalla es blanco puro durante segundos. Se elimina en main.jsx
         antes del primer render. */
      html, body { margin: 0; height: 100%; }
      /* La banda del cascaron reproduce EXACTAMENTE la geometria del banner
         (3032/177 con piso de 68 px). Si no coincidiera, al montar la app la
         cabecera daria un salto y el mapa se recalcularia dos veces. */
      #arranque { position: fixed; inset: 0; background: #f6f8f6;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0f2e1c; }
      #arranque .banda { height: max(68px, calc(100vw / 17.1299)); background: #064928; }
      #arranque .txt { display: grid; place-content: center;
        height: calc(100dvh - max(68px, 100vw / 17.1299)); gap: 10px; text-align: center; }
      @media (prefers-color-scheme: dark) {
        #arranque { color: #e7efe9; background: #10161b; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="arranque">
      <div class="banda"></div>
      <div class="txt">
        <p>Cargando el Catastro nacional…</p>
        <p id="arranque-lento" hidden>Está tardando más de lo normal.</p>
      </div>
    </div>
    <script>
      // setTimeout clasico y no un observer: el unico objetivo es que, si la
      // descarga se atasca, la pantalla deje de mentir diciendo "cargando".
      setTimeout(function () {
        var e = document.getElementById('arranque-lento')
        if (e) e.hidden = false
      }, 15000)
    </script>
    <noscript>
      <p style="font: 15px system-ui; padding: 24px">
        Este visor necesita JavaScript. Los datos publicados están disponibles en
        <a href="./datos/manifest.json">datos/manifest.json</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
