name: Actualizar README

on:
  push:
    branches: [main]
    paths:
      - 'ETL/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  models: read          # habilita GitHub Models para el GITHUB_TOKEN

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # El diff acotado es lo que mantiene la peticion dentro del limite de
      # entrada del tier gratuito (8K tokens). Sin el head -c, un commit grande
      # devuelve 413 y el job falla por una razon que no es la interesante.
      - name: Preparar contexto
        run: |
          git diff HEAD~1 HEAD -- ETL frontend .github | head -c 12000 > /tmp/diff.txt
          sed -n '/AUTODOC:INICIO/,/AUTODOC:FIN/p' README.md > /tmp/bloque.txt

      - id: ia
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          max-tokens: 800
          system-prompt: |
            Editas UNA seccion de un README. Usa solo lo que aparece en el
            contexto. No inventes comandos, variables ni dependencias.
            Responde en espanol, en Markdown, sin fences ni explicaciones.
            Si la seccion sigue siendo correcta responde exactamente: NO_UPDATE
          prompt: |
            CAMBIOS RECIENTES
            ${{ github.workspace && '' }}
            $(cat /tmp/diff.txt)

            SECCION ACTUAL
            $(cat /tmp/bloque.txt)

      # La verificacion que queda: que no sea NO_UPDATE y que traiga algo.
      # No hace falta mas, porque el resto del README no esta en juego.
      - name: Aplicar
        env:
          RESP: ${{ steps.ia.outputs.response }}
        run: |
          [ "${RESP:0:9}" = "NO_UPDATE" ] && { echo "sin cambios"; exit 0; }
          [ ${#RESP} -lt 40 ] && { echo "respuesta demasiado corta"; exit 1; }
          python3 - <<'EOF'
          import os, re, pathlib
          p = pathlib.Path("README.md"); t = p.read_text(encoding="utf-8")
          nuevo = ("<!-- AUTODOC:INICIO -->\n"
                   + os.environ["RESP"].strip()
                   + "\n<!-- AUTODOC:FIN -->")
          t2 = re.sub(r"<!-- AUTODOC:INICIO -->.*?<!-- AUTODOC:FIN -->",
                      lambda _: nuevo, t, flags=re.S)
          assert t2 != t, "los marcadores AUTODOC no estan en el README"
          p.write_text(t2, encoding="utf-8")
          EOF

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: actualizar seccion autodocumentada"
          branch: readme/autodoc
          title: "Actualización del README"
          delete-branch: true