name: AI README Maintenance

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Analyze and update README
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Download llama.cpp
        run: |
          set -e

          LLAMA_VERSION="b10507"

          mkdir -p "$HOME/llama"

          wget -q \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.tar.gz" \
            -O "$HOME/llama/llama.tar.gz"

          tar -xzf "$HOME/llama/llama.tar.gz" \
            -C "$HOME/llama"

          find "$HOME/llama" -type f -name "llama-cli" -print

      - name: Download Qwen model
        run: |
          set -e

          mkdir -p "$HOME/models"

          python - <<'PY'
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="Qwen/Qwen2.5-1.5B-Instruct-GGUF",
              filename="qwen2.5-1.5b-instruct-q4_k_m.gguf",
              local_dir="/home/runner/models"
          )
          PY

      - name: Prepare repository context
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -e

          echo "=== COMMIT ==="
          git log -1 --oneline

          echo "=== CHANGED FILES ==="

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" \
              > /tmp/changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" \
              > /tmp/changed-files.txt
          fi

          cat /tmp/changed-files.txt

          echo "=== DIFF ==="

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git show --format= --stat "$AFTER_SHA" > /tmp/diff.txt
            git show --format= "$AFTER_SHA" >> /tmp/diff.txt
          else
            git diff "$BEFORE_SHA" "$AFTER_SHA" > /tmp/diff.txt
          fi

          # Evita enviar cantidades absurdas de código al modelo.
          # El README y el diff son suficientes para esta tarea.
          head -c 120000 /tmp/diff.txt > /tmp/diff-limited.txt

      - name: Run AI README analyzer
        env:
          LLAMA_ROOT: /home/runner/llama
          MODEL_PATH: /home/runner/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        run: |
          set -e

          LLAMA_BIN=$(find "$LLAMA_ROOT" -type f -name "llama-cli" | head -1)

          if [ -z "$LLAMA_BIN" ]; then
            echo "ERROR: llama-cli no encontrado"
            find "$LLAMA_ROOT" -maxdepth 3 -type f | head -100
            exit 1
          fi

          chmod +x "$LLAMA_BIN"

          python scripts/update_readme.py \
            --llama "$LLAMA_BIN" \
            --model "$MODEL_PATH" \
            --readme README.md \
            --diff /tmp/diff-limited.txt \
            --changed-files /tmp/changed-files.txt

      - name: Check README changes
        id: changes
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "README no necesita cambios."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "README fue actualizado."
            git diff -- README.md
          fi

      - name: Validate README change
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -e

          # Solo README.md puede haber cambiado.
          OTHER_CHANGES=$(git status --short | \
            grep -vE '^[ MADRCU?]{2} README\.md$' || true)

          if [ -n "$OTHER_CHANGES" ]; then
            echo "ERROR: El proceso modificó archivos distintos de README.md:"
            echo "$OTHER_CHANGES"
            git restore --staged .
            git restore .
            exit 1
          fi

          # El README no puede quedar vacío.
          if [ ! -s README.md ]; then
            echo "ERROR: README.md quedó vacío."
            exit 1
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          BRANCH="docs/ai-update-readme-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add README.md

          git commit -m "docs: update README"

          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: update README" \
            --body "## README maintenance

          This pull request was generated automatically after changes were pushed to \`main\`.

          The local documentation model analyzed the repository changes and determined that the README required an update.

          Only \`README.md\` was modified."