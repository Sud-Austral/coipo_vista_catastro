name: Desplegar en GitHub Pages

# El ETL NO corre aqui, y es deliberado: su insumo es
# data/catastro_gef_singeometria.duckdb, 321 MiB que estan en .gitignore y que
# GitHub no aceptaria de todos modos (bloquea archivos > 100 MiB). Los artefactos
# derivados se generan en local con `python ETL/build_bin.py` y SE COMMITEAN.
# Lo que hace este workflow es comprobar que lo commiteado es integro y coherente
# con su manifest, y publicar.
#
# En un PR corren SOLO `datos` y `build`: el PR se revisa con las mismas guardas que
# el despliegue, pero no publica. Hasta el 2026-09-26 los PR no corrian nada, asi que
# un defecto se descubria recien en main (DECISIONES §M.6).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/robots-raiz.txt'
      - 'ETL/**'          # el gate de datos vive aqui: si cambia, hay que reejecutarlo
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/robots-raiz.txt'
      - 'ETL/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Ademas protege el limite blando de 10 builds/hora de
# Pages cuando se empujan varios commits seguidos.
# Cada PR va en su PROPIO grupo: con uno solo, abrir un PR cancelaria un
# despliegue de main a medio publicar.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  datos:
    name: Integridad de los datos commiteados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # numpy y scipy SOLO para D26, que recalcula el solape de los discos sobre
      # el .bin publicado con un KD-tree. El resto de verificar_datos.py es
      # biblioteca estandar a proposito --corre en cualquier sitio sin instalar
      # nada-- y si estas faltan, D26 lo DICE y cuenta como fallo, no se salta en
      # silencio. Aqui se instalan para que el gate sea real en cada despliegue.
      - run: pip install --quiet numpy scipy
      - name: Comprobar manifest, tamanos, sha256 y cifras
        # Las aserciones viven en ETL/verificar_datos.py y no aqui dentro: una
        # asercion que solo existe en el YAML no se puede correr en local ni,
        # sobre todo, VER FALLAR. --negativas reintroduce cada defecto y exige
        # que su asercion se ponga roja, asi que el gate se comprueba a si mismo
        # en cada despliegue.
        run: python ETL/verificar_datos.py --negativas

  build:
    name: Compilar el frontend
    runs-on: ubuntu-latest
    outputs:
      huella: ${{ steps.huella.outputs.huella }}
    steps:
      # HISTORIA COMPLETA, sin los blobs viejos. Las paginas por region y comuna
      # llevan la fecha del ultimo commit que toco los datos (dateModified,
      # lastmod), y en un clon superficial `git log -- <ruta>` devuelve la del
      # HEAD SIN NINGUN ERROR: por eso web.mjs se niega a correr en uno. El pack
      # entero pesa ~121 MiB por los .bin viejos; blob:none baja solo el arbol.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

      # LA CASCADA DE LOS FILTROS, contrastada contra un oraculo independiente
      # sobre las 1.827.933 filas commiteadas. Va ANTES del build a proposito:
      # es aritmetica, tarda segundos y no necesita navegador, asi que si el
      # cruce esta roto no tiene sentido seguir. Es lo unico de la interfaz que
      # el CI puede correr -- frontend/verificacion/verificar.py necesita Chrome.
      - run: node verificacion/marginales.mjs --negativas
        working-directory: frontend

      # Las cifras que cita la PROSA (src/hechos.js), recalculadas por otro camino
      # sobre los datos commiteados, y el filtro del ambito que comparten el panel
      # y las paginas por region y comuna. Node pelado, un segundo.
      - run: npm run prueba
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # La trampa mas cara de este stack: un `base` mal resuelto NO hace fallar
      # el build -- termina con codigo 0 y emite rutas que piden los assets a la
      # raiz del dominio, asi que el sitio publicado sale en blanco. Se comprueba
      # el ARTEFACTO, no la configuracion.
      - name: Comprobar el base path en dist/index.html
        working-directory: frontend
        run: |
          if ! grep -q '/coipo_vista_catastro/assets/' dist/index.html; then
            echo "FALLA: dist/index.html no referencia /coipo_vista_catastro/assets/"
            grep -oE '(src|href)="[^"]*"' dist/index.html
            exit 1
          fi
          if [ ! -s dist/datos/manifest.json ] || [ ! -s dist/datos/cbn_puntos.bin ]; then
            echo "FALLA: los datos no llegaron a dist/"
            exit 1
          fi
          echo "base path y datos OK"

      # EL ROBOTS.TXT DE LA RAIZ del host (docs/robots-raiz.txt), leido con
      # RFC 9309: los que citan pasan, los que entrenan no. Vive en el repo de la
      # organizacion; aqui se vigila la copia de referencia (DECISIONES §M.2).
      - run: node scripts/robots.mjs
        working-directory: frontend

      # LAS PAGINAS POR REGION Y COMUNA (DECISIONES §M.9). --negativas rompe
      # cada control del generador antes de generar; validar:paginas recalcula
      # las cifras con un oraculo propio y comprueba el artefacto.
      - run: npm run build:web -- --negativas
        working-directory: frontend
      - run: npm run validar:paginas
        working-directory: frontend

      # DETERMINISMO: dos corridas del mismo commit, los mismos bytes. Una fecha
      # de construccion o un orden de claves inestable apareceria aqui. Antes, el
      # control de que la comparacion sirve: una copia alterada tiene que diferir.
      - name: El generador es determinista
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/a"
          cp -r dist "$RUNNER_TEMP/a/"
          cp -r dist "$RUNNER_TEMP/alterada"
          echo "x" >> "$RUNNER_TEMP/alterada/comuna/valdivia/index.html"
          if diff -rq "$RUNNER_TEMP/alterada" dist > /dev/null; then
            echo "FALLA: diff -r no ve una pagina alterada; el control no sirve"; exit 1
          fi
          npm run build:web
          diff -r "$RUNNER_TEMP/a/dist" dist
          echo "dos corridas, los mismos bytes"

      # La prueba de humo tiene que poder ponerse ROJA. Sus negativas montan
      # sitios rotos en memoria (503 permanente, huella que no llega, .bin que no
      # mide lo declarado, manifest que no es JSON) y exigen que cada uno falle;
      # y 503 -> 503 -> 200 tiene que pasar. Sin red: corre en los PR.
      - run: node scripts/humo.mjs --negativas
        working-directory: frontend

      # Huella de lo que se va a publicar: sha256 de index.html seguido del
      # manifest. El humo espera a que Pages sirva ESTOS bytes antes de mirar
      # nada, asi que no puede aprobar el sitio de ayer.
      - id: huella
        working-directory: frontend
        run: echo "huella=$(node scripts/humo.mjs --huella-de dist)" >> "$GITHUB_OUTPUT"

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publicar
    if: github.event_name != 'pull_request'
    needs: [datos, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  humo:
    name: Prueba de humo sobre el sitio publicado
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      # Unico punto donde se observa Pages de verdad. Todo lo anterior mira
      # artefactos locales; esto mira lo que recibe una persona.
      #
      # Vivia aqui como un bloque de curl, y el despliegue del 2026-09-03 quedo en
      # rojo con el sitio bien publicado: la peticion de rango del .bin tardo 60 s
      # y devolvio un 503 de Pages un minuto despues de publicar, sin reintento.
      # Ahora vive en frontend/scripts/humo.mjs, que reintenta ante red, 429 y
      # 5xx, espera la huella del build y tiene negativas (job build).
      # frontend/src/web y no solo scripts: robots.mjs lee sitio.js (el `base`),
      # y sin el el import falla y el humo quedaria rojo tras cada despliegue.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            frontend/scripts
            frontend/src/web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pedir el sitio y sus datos
        run: >-
          node frontend/scripts/humo.mjs
          --base https://sud-austral.github.io/coipo_vista_catastro
          --huella ${{ needs.build.outputs.huella }}
          --run ${{ github.run_id }}-${{ github.run_attempt }}
